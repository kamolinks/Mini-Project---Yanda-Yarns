<!DOCTYPE html>
<html lang="en">

<head>
  <a href="index.html">
    <title>Yanda Yarns - Shop</title>
  </a>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="index,follow">
  <meta name="generator" content="GrapesJS Studio">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Playfair+Display:wght@400;600;700&amp;display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./shop.css">
  <script type="module" src="firebaseauth.js"></script>
  
</head>

<body class="gjs-t-body body-wrapper">
  <header class="header">
    <div class="header-container"><a href="" class="group header-logo-link">
        <img src="images/logo.jpeg" alt="Yanda Yarns Logo" class="header-logo-image" />
        <span class="group-hover:text-[color:var(--gjs-t-color-accent)] header-logo-text">Yanda Yarns</span></a>
      
      <div class="header-actions">
        <div class="search-wrapper"><input type="text" placeholder="Search crochet items" aria-label="Search"
            class="search-input" /><a href="#">
            <img src="https://api.iconify.design/lucide-search.svg?color=%23e5e7eb" alt="Search Icon"
              class="search-icon" /></div>
        <span id="userGreeting"></span>
        <a href="#" class="account-link"><img src="images/user icon.svg"
            alt="User Icon" class="account-icon" id="userIcon" /></a>
        <button id="logoutBtn">Sign Out</button>
      </div>
      
      <button type="button" class="cart-button" id="cartIcon"><img
          src="images/cart icon.svg" alt="Cart Icon"
          class="cart-icon" /><span class="cart-badge"
          id="cartCount">0</span></button><button type="button" aria-label="Open menu" id="menuToggle"
        class="mobile-menu-button"><img src="https://api.iconify.design/lucide-menu.svg?color=%23e5e7eb" alt="Menu Icon"
          class="menu-icon" /></button>
    
    </div>
    <div class="nav-container">
      <nav class="header-navigation">
        <a href="index.html" class="hideOnMobile">Home</a>
        <a href="shop.html" class="hideOnMobile" id="shopLink">Shop</a>
        <a href="request.html" class="hideOnMobile">Request</a>
        <a href="about.html" class="hideOnMobile">About Us</a>
        
        <button type="button" class="cart-button-mobile" id="cartIcon"><img
          src="images/cart icon.svg" alt="Cart Icon"
          class="cart-icon" /><span class="cart-badge-mobile"
          id="cartCountMobile">0</span>
        </button>

        <button class="logout-mobile">
          <img src="images/logout icon.svg" alt="Logout Icon" class="lock-icon" id="logoutIcon" />
        </button>

        <a href="#" onclick=showSidebar() class="menu-button"><img src="images/menu icon.svg" alt="Menu"></a>
      </nav>

      <nav class="sidebar">
        <a href="#" onclick=hideSidebar()><img src="images/close icon.svg" alt="Close menu"></a>
        <a href="index.html" class="gjs-t-link nav-link">Home</a>
        <a href="shop.html" class="gjs-t-link nav-link" id="shopLink">Shop</a>
        <a href="request.html" class="gjs-t-link nav-link">Request</a>
        <a href="about.html" class="gjs-t-link nav-link">About Us</a>
        <a href="profile.html" class="gjs-t-link nav-link" id="profileLink">Profile</a>
        
      </nav>

      <script>
        function showSidebar() {
          const sidebar = document.querySelector('.sidebar');
          if (sidebar) {
            sidebar.style.display = 'flex';
          }
        }

        function hideSidebar() {
          const sidebar = document.querySelector('.sidebar');
          if (sidebar) {
            sidebar.style.display = 'none';
          }
        }
      </script>
      
    </div>

    <div class="search-wrapper-mobile"><input type="text" placeholder="Search crochet items" aria-label="Search"
            class="search-input-mobile" /><a href="#">
            <img src="https://api.iconify.design/lucide-search.svg?color=%23e5e7eb" alt="Search Icon"
              class="search-icon" /></div>
    </div>
    
  </header>
  <div class="shop-layout" style="display: flex; align-items: flex-start;">
    <aside class="filters">
      <h3>Filter By Category</h3>
      <label><input type="checkbox" value="clothing"> Clothing</label>
      <label><input type="checkbox" value="hats"> Hats</label>
      <label><input type="checkbox" value="bags"> Bags</label>
      <label><input type="checkbox" value="accessories"> Accessories</label>
      <label for="priceRange">Price Range:</label>
      <select id="priceRange" style="width:100%;margin-bottom:1em;">
        <option value="all">All</option>
        <option value="0-200">R0 - R200</option>
        <option value="200-500">R200 - R500</option>
        <option value="500-1000">R500 - R1000</option>
        <option value="1000+">R1000+</option>
      </select>
      <button id="applyFiltersBtn" class="gjs-t-button">Apply Filters</button>
    </aside>
    <section id="shop-products-section" style="flex:1; padding-left:2rem;">
      <div id="shop-products-grid" class="product-grid"></div>
    </section>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span id="closeBtn">&times;</span>
      <h2 id="modalTitle">Login</h2>
      <input type="text" id="authName" placeholder="Name" style="display:none;">
      <input type="email" id="authEmail" placeholder="Email">
      <input type="password" id="authPassword" placeholder="Password">
      <button id="authButton">Login</button>

      <p id="toggleText">
        Don't have an account?
        <a href="#" id="signUp">Signup</a>
      </p>
    </div>
  </div>

  <div id="cartModal" class="modal hidden">
    <div class="modal-content">
      <span id="closeCartBtn" style="position:absolute;top:1rem;right:1.5rem;font-size:2rem;color:#888;cursor:pointer;z-index:10;">&times;</span>
      <h2>Your Cart</h2>
      <div id="cartItems"></div>
      <h3>Total: R<span id="cartTotal">0</span></h3>
      <button id="goToCheckout">Go To Checkout</button>
    </div>
  </div>


<script type="module" src="firebaseauth.js"></script>
<script type="module" src="script.js"></script>
<script type="module" src="shop.js"></script>
</body>

</html>
