  <main class="request-main">
    <section class="request-section">
      <h2>Custom Crochet Request</h2>
      <form id="customRequestForm" enctype="multipart/form-data" style="max-width:400px;margin:2rem auto;padding:2rem;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <label for="requestDescription">Describe what you want made:</label>
        <textarea id="requestDescription" name="description" rows="4" style="width:100%;margin-bottom:1rem;"></textarea>
        <button type="submit" style="width:100%;padding:0.75rem 0;background:#e5e7eb;color:#333;border:none;border-radius:6px;font-weight:600;">Submit Request</button>
      </form>
      <div id="requestStatus" style="text-align:center;margin-top:1rem;"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span id="closeBtn">&times;</span>

      <input type="email" id="authEmail" placeholder="Email">
      <input type="password" id="authPassword" placeholder="Password">
      <button id="authButton">Login</button>

      <p id="toggleText">
        Don't have an account?
        <a href="#" id="signUp">Signup</a>
      </p>
    </div>
  </div>
